[project]
name = "ragtone"
version = "0.1.0"
description = "Local hybrid retrieval cache for team chat, Jira, and Confluence."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "elasticsearch>=9.0.0,<10",
  "fastembed>=0.5.0",
  "httpx>=0.27",
  "httpx2>=2.5.0",
  "mcp>=2.2.0,<3",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ragtone = "ragtone.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragtone = ["web/board/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
