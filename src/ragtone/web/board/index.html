<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trilha · ragtone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/board.css" />
  </head>
  <body>
    <script>
      try {
        if (localStorage.getItem("ragtone.rail-collapsed") === "1") {
          document.body.classList.add("rail-collapsed");
        }
      } catch (err) {}
    </script>
    <aside class="rail" id="rail">
      <div class="rail-inner">
        <div class="rail-head">
          <p class="mark">Trilha</p>
          <button
            type="button"
            id="hide-rail"
            class="rail-toggle"
            aria-controls="rail"
            aria-expanded="true"
            aria-label="Esconder menu"
            title="Esconder menu"
          >
            ‹
          </button>
        </div>
        <button type="button" id="open-finder">
          Buscar
          <kbd data-finder-chord>⌘K</kbd>
        </button>
        <p class="lede">
          Buscar abre o índice. Clique num recente para soltar no canvas.
          Arrasta o cobre para ligar. Duplo clique na corda corta.
        </p>
        <div class="feed">
          <p class="search-label" id="recents-label">Recentes</p>
          <div id="recents" class="hits"></div>
        </div>
        <div class="rail-foot">
          <button type="button" id="open-admin">Admin</button>
          <p class="search-label">Caminhos</p>
          <button type="button" id="new-walk">Nova trilha</button>
          <ol id="walk-list"></ol>
        </div>
      </div>
    </aside>
    <main id="stage">
      <button
        type="button"
        id="show-rail"
        class="rail-peek"
        aria-controls="rail"
        aria-expanded="true"
        aria-label="Mostrar menu"
        title="Mostrar menu"
      >
        ›
      </button>
      <button type="button" id="open-finder-float" class="spot-launch">
        Buscar
        <kbd data-finder-chord>⌘K</kbd>
      </button>
      <div id="viewport">
        <div id="world">
          <div id="paper" aria-hidden="true"></div>
          <svg id="edges" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="nodes"></div>
        </div>
      </div>
      <nav id="strip" aria-label="Caminho percorrido"></nav>
      <section id="finder" hidden>
        <div class="finder-sheet" role="dialog" aria-modal="true" aria-labelledby="finder-field-label">
          <header class="finder-bar">
            <div class="finder-bar-head">
              <label class="search-label" id="finder-field-label" for="q">Índice</label>
              <div class="finder-actions">
                <button type="button" id="drop">Soltar nota</button>
                <button type="button" id="close-finder" class="ghost">Fechar</button>
              </div>
            </div>
            <input id="q" type="search" placeholder="SSO, ABC-12, runbook…" autocomplete="off" />
            <p id="finder-status" class="status"></p>
          </header>
          <nav id="finder-filters" class="finder-filters" hidden aria-label="Filtrar por conector"></nav>
          <div id="finder-hits" class="finder-hits"></div>
        </div>
      </section>
      <section id="admin" hidden>
        <div class="admin-sheet">
          <header class="admin-head">
            <div class="admin-title">
              <p class="search-label">Admin</p>
              <h2>Índice</h2>
            </div>
            <p id="admin-index"></p>
            <button type="button" id="close-admin" class="ghost">Fechar</button>
          </header>
          <div class="admin-tools">
            <form id="admin-backfill-form" class="admin-backfill">
              <fieldset id="admin-backfill-connectors" class="admin-backfill-connectors">
                <legend class="search-label">Quais conectores</legend>
              </fieldset>
              <fieldset id="admin-backfill-sources" class="admin-backfill-connectors" hidden>
                <legend class="search-label">Quais fontes</legend>
              </fieldset>
              <label>
                <span class="search-label">Quanto tempo para trás</span>
                <select
                  id="admin-backfill-days"
                  aria-label="Quanto tempo para trás"
                ></select>
              </label>
              <div class="admin-backfill-actions">
                <button type="submit" id="start-backfill">Começar backfill</button>
                <button type="button" id="stop-sync" hidden>Parar</button>
              </div>
            </form>
            <button type="button" id="sync-all">Atualizar todos</button>
            <p id="admin-job"></p>
            <div id="admin-progress" hidden>
              <div class="admin-progress-track">
                <span id="admin-progress-fill"></span>
              </div>
              <p id="admin-progress-label"></p>
            </div>
            <div id="admin-dlq"></div>
          </div>
          <ul id="admin-gaps"></ul>
          <section class="admin-block">
            <h3>Conectores</h3>
            <div id="admin-connectors"></div>
          </section>
          <section class="admin-block">
            <h3>Recentes no índice</h3>
            <div id="admin-recent"></div>
          </section>
        </div>
      </section>
    </main>
    <aside id="inspector" hidden>
      <button type="button" id="close-inspector" class="ghost">Fechar</button>
      <p class="eyebrow" id="insp-source"></p>
      <h2 id="insp-title"></h2>
      <p id="insp-excerpt"></p>
      <a id="insp-url" hidden target="_blank" rel="noreferrer">Abrir origem</a>
      <div id="insp-body"></div>
    </aside>
    <script src="/static/board.js"></script>
  </body>
</html>
